services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: usercue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usercue}
      POSTGRES_DB: usercue
    ports:
      - "6556:6556"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usercue -d usercue"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${OUTBOUND_APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://usercue:${POSTGRES_PASSWORD:-usercue}@postgres:5432/usercue
      DATA_DIR: /data
      PORT: "3000"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SECRET_KEY: ${SECRET_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    volumes:
      - uploads:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
  uploads:
