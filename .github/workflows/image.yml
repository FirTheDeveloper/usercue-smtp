name: Release image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish with this release
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/paddlewheel-inc/usercue:latest
            ghcr.io/paddlewheel-inc/usercue:${{ github.sha }}
            ghcr.io/paddlewheel-inc/usercue:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Paddlewheel-Inc/usercue
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/usercue" \
            -f visibility=public
